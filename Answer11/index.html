<!DOCTYPE html>
<html>
<head>
    <title>CSS Units and Variables</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Units and Variables</h1>

    <div class="box">
        <h2>CSS Units</h2>
        <p class="pixel">This text uses pixels.</p>
        <p class="percentage">This box uses percentage width.</p>
        <p class="rem">This text uses rem units.</p>
    </div>

    <div class="container">
        <h2>CSS Variables</h2>
        <p>CSS variables store reusable values.</p>
    </div>

</body>
</html>
