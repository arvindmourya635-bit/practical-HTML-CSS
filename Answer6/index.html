<!DOCTYPE html>
<html>
<head>
    <title>Types of HTML Lists</title>
</head>
<body>

    <h1>Types of HTML Lists</h1>

    <h2>1. Ordered List</h2>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h2>2. Unordered List</h2>
    <ul>
        <li>Java</li>
        <li>Python</li>
        <li>C++</li>
    </ul>

    <h2>3. Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>Used to create web pages.</dd>

        <dt>CSS</dt>
        <dd>Used to style web pages.</dd>
    </dl>

</body>
</html>
