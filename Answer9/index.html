<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

    <h1>Student Marks Table</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Rahul</td>
                <td>85</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Amit</td>
                <td>90</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Arvind</td>
                <td>88</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2">Total Students</td>
                <td>3</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
